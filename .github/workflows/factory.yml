name: factory

# Makes one original faceless video per run, $0: free LLM (pollinations),
# free TTS (edge-tts), free lip sync (rhubarb), free render (hyperframes CLI).
# Fully cloud-hosted: GitHub runners render + publish; triggers are layered -
# cron-job.org "Pixel Guy loop" (workflow_dispatch, primary) then these
# guarded GitHub cron slots as backup when the primary's run didn't succeed.

on:
  schedule:
    # BACKUP layer only: cron-job.org job "Pixel Guy loop" is the primary - it
    # POSTs workflow_dispatch at 00:00/06:00/12:00/18:00 Asia/Manila
    # (= 04:00/10:00/16:00/22:00 UTC). These slots sit 30 min behind it and are
    # guarded: they render only if no factory run succeeded in the last 3h
    # (GitHub cron skips slots - missed 4 hourly windows straight on 11/25 -
    # and the same protection keeps the two layers from double-posting).
    - cron: "30 4,10,16,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read   # backup-slot guard reads recent factory runs

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install python deps
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: System deps (headless render + ffmpeg)
        run: |
          sudo apt-get update -qq
          # libasound2 is libasound2t64 on Ubuntu 24.04 runners; try both.
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 > /dev/null || \
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 > /dev/null
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1

      - name: Cache rhubarb
        id: rhubarb
        uses: actions/cache@v4
        with:
          path: tools/rhubarb
          key: rhubarb-1.14.0-linux

      - name: Download rhubarb-lip-sync (MIT, free)
        if: steps.rhubarb.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/rhubarb
          curl -sL -o /tmp/rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip
          unzip -o -q /tmp/rhubarb.zip -d /tmp/rhubarb
          BIN=$(find /tmp/rhubarb -name rhubarb -type f | head -1)
          cp "$BIN" tools/rhubarb/
          # rhubarb needs its resource folder (sphinx dict etc.) next to the binary
          cp -r "$(dirname "$BIN")/res" tools/rhubarb/res
          chmod +x tools/rhubarb/rhubarb
          tools/rhubarb/rhubarb --version

      - name: Cache hyperframes + chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
            ~/.cache/hyperframes
          key: hf-${{ runner.os }}-0.9.56

      - name: Backup-slot guard (scheduled runs only)
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip this scheduled run if another factory run within the last 3h
          # already succeeded or is still working (manual dispatches always run).
          SINCE=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENT=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=40" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .name == \"factory\" and .created_at > \"${SINCE}\" and (.status == \"in_progress\" or .status == \"queued\" or .conclusion == \"success\"))] | length")
          echo "recent factory runs inside the 3h window: ${RECENT}"
          if [ "${RECENT}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make one video
        if: steps.gate.outputs.skip != 'true'
        env:
          # raises the GitHub search API limit on shared runner IPs (trending picks)
          GITHUB_TOKEN: ${{ github.token }}
        run: python pipeline/make_video.py

      - name: Publish video as a release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls -t out/*.mp4 | head -1)
          TAG="video-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" "$FILE" --title "$TAG" \
            --notes "Automated original faceless video (pixel guy + edge-tts + rhubarb + hyperframes)."

      - name: Post to Facebook + Instagram + YouTube
        if: steps.gate.outputs.skip != 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PUBLIC_URL_BASE: ${{ secrets.IG_PUBLIC_URL_BASE }}
          IG_UPLOAD_ENDPOINT: ${{ secrets.IG_UPLOAD_ENDPOINT }}
          IG_UPLOAD_ACCESS_KEY: ${{ secrets.IG_UPLOAD_ACCESS_KEY }}
          IG_UPLOAD_SECRET_KEY: ${{ secrets.IG_UPLOAD_SECRET_KEY }}
          IG_UPLOAD_REGION: ${{ secrets.IG_UPLOAD_REGION }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          HASHTAGS: ${{ vars.HASHTAGS }}
        run: python pipeline/publish.py   # skips platforms whose secrets are unset

      - name: Commit state (used topics)
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "pixel-factory"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then echo "no state change"; else
            git commit -m "state: log video [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
