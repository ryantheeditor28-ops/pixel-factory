name: comment-bot

# Comment-gate auto-DM: watches comments on posted FB/IG reels and YouTube
# videos and replies with the promised links when someone comments the trigger
# keyword (the videos' CTA) — private replies on FB/IG, public replies on
# YouTube. Hourly cron — webhooks would need a public always-on endpoint,
# which the $0/no-server factory doesn't have. State (dm_log.json) dedupes
# across runs and is committed back only when it changed.

on:
  schedule:
    # GitHub's cron skips slots (missed 4 hourly windows straight on 11/25), so
    # the bot fires twice an hour: extra runs are harmless no-ops (dm_log dedupe
    # means nothing to commit when no keyword comments are pending).
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: comment-bot
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Reply to keyword comments with the promised links
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/comment_bot.py

      - name: Commit DM log (only when it changed)
        run: |
          git config user.name "pixel-factory"
          git config user.email "actions@users.noreply.github.com"
          git add state/dm_log.json state/posts.json
          if git diff --staged --quiet; then echo "no dm log change"; else
            git commit -m "comment-bot: dm log [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
